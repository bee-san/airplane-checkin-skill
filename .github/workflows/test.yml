name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
      - run: npm run lint
      - run: npm run secret-scan