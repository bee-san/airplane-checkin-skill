<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Airplane Check-in Skill</title>
  <desc id="desc">A stylised browser window, aeroplane and check mark beside the project title and the slogan safe multi-airline orchestration for Hermes Agent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08152e"/>
      <stop offset="0.55" stop-color="#122d5a"/>
      <stop offset="1" stop-color="#194f73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffbe55"/>
      <stop offset="1" stop-color="#ff718d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020817" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="70" r="120" fill="#57d5e8" opacity="0.08"/>
  <circle cx="1040" cy="330" r="180" fill="#ff718d" opacity="0.06"/>
  <g transform="translate(75 67)" filter="url(#shadow)">
    <rect width="360" height="226" rx="22" fill="#f7fbff"/>
    <path d="M22 0h316a22 22 0 0 1 22 22v35H0V22A22 22 0 0 1 22 0Z" fill="#dce8f5"/>
    <circle cx="28" cy="29" r="7" fill="#ff718d"/>
    <circle cx="52" cy="29" r="7" fill="#ffbe55"/>
    <circle cx="76" cy="29" r="7" fill="#4ed3a5"/>
    <path d="M57 139c75-31 123-43 217-46l42-25 17 7-27 24 37 11-9 10-54-11c-68 9-134 27-205 57l-35-8 17-19Z" fill="#173c68"/>
    <circle cx="285" cy="164" r="35" fill="#4ed3a5"/>
    <path d="m268 164 11 11 23-27" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(500 90)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="49" font-weight="750">Airplane Check-in</text>
    <text x="0" y="66" dominant-baseline="hanging" fill="url(#accent)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="47" font-weight="700">Hermes Skill</text>
    <text x="0" y="142" dominant-baseline="hanging" fill="#d9eaff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">Safe multi-airline orchestration,</text>
    <text x="0" y="176" dominant-baseline="hanging" fill="#d9eaff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">timing, privacy and verification.</text>
